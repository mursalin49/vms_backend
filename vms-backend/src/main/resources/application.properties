spring.application.name=vms-backend
server.port=${PORT:8080}

# --- MySQL (override with env vars; docker-compose sets these) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/vms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:vms}
spring.datasource.password=${DB_PASSWORD:vms_password}

# --- Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it ---
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Security ---
app.jwt.secret=${JWT_SECRET:change-this-secret-to-at-least-32-characters-long}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,https://*.netlify.app}

# --- First-start data ---
app.admin.email=${ADMIN_EMAIL:admin@starkgroup.com}
app.admin.password=${ADMIN_PASSWORD:StrongPassword123}
app.seed.sample-data=${SEED_SAMPLE_DATA:true}

# --- Ops ---
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
